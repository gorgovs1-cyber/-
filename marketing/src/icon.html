<!doctype html><html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Rubik:wght@700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1024px;height:1024px;overflow:hidden}
body{position:relative;background:#0D1117}
.bg{position:absolute;inset:0;background:radial-gradient(80% 80% at 30% 25%, #1C2A2E 0%, #0D1117 70%)}
.ring{position:absolute;width:760px;height:760px;border-radius:50%;top:132px;left:132px;
  border:3px solid rgba(45,212,191,.18);box-shadow:0 0 120px rgba(45,212,191,.22) inset}
.shk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Rubik',sans-serif;font-weight:800;font-size:560px;color:#2DD4BF;
  text-shadow:0 0 60px rgba(45,212,191,.55);line-height:1}
.spark{position:absolute;width:26px;height:26px;border-radius:50%;background:#F59E0B;
  box-shadow:0 0 30px #F59E0B;top:300px;left:690px}
</style></head><body>
<div class="bg"></div>
<div class="ring"></div>
<div class="shk">₪</div>
<div class="spark"></div>
</body></html>
