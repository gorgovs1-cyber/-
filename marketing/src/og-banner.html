<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Rubik:wght@500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#0D1117}
body{font-family:'Heebo',sans-serif;color:#fff;position:relative}
.glow{position:absolute;border-radius:50%;filter:blur(100px)}
.g1{width:560px;height:560px;background:#2DD4BF;top:-220px;left:-160px;opacity:.26}
.g2{width:460px;height:460px;background:#F59E0B;top:320px;left:860px;opacity:.15}
.wrap{position:absolute;inset:0;display:flex;align-items:center;padding:0 80px}
.left{flex:1}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:30px}
.shekel{font-size:54px;color:#2DD4BF;text-shadow:0 0 24px rgba(45,212,191,.5)}
.bname{font-family:'Rubik';font-size:32px;font-style:italic;font-weight:700;color:#2DD4BF}
.headline{font-size:62px;font-weight:900;line-height:1.1;letter-spacing:-1px}
.headline .hi{color:#2DD4BF}
.sub{margin-top:24px;font-size:27px;font-weight:500;color:#C9D1D9;line-height:1.5;max-width:520px}
.tags{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap}
.tag{background:rgba(45,212,191,.1);border:1px solid rgba(45,212,191,.3);color:#2DD4BF;
  font-weight:700;font-size:23px;padding:10px 22px;border-radius:30px}
.phone{width:280px;height:460px;border-radius:40px;border:8px solid #1C2128;flex-shrink:0;margin-left:70px;
  background:linear-gradient(170deg,#161B22,#0D1117);position:relative;box-shadow:0 36px 80px -28px rgba(0,0,0,.8),0 0 0 2px rgba(45,212,191,.15)}
.notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:100px;height:22px;background:#0D1117;border-radius:14px}
.scard{position:absolute;top:60px;left:26px;right:26px;background:linear-gradient(135deg,rgba(45,212,191,.14),rgba(45,212,191,.04));
  border:1px solid rgba(45,212,191,.25);border-radius:20px;padding:22px;text-align:center}
.scard .lbl{font-size:18px;color:#8B97A6;font-weight:500}
.scard .val{font-size:46px;font-weight:800;color:#2DD4BF;margin-top:6px;direction:ltr}
.srow{position:absolute;left:26px;right:26px;display:flex;justify-content:space-between;align-items:center;
  background:rgba(255,255,255,.04);border-radius:14px;padding:15px 18px}
.r1{top:210px}.r2{top:286px}.r3{top:362px}
.srow .nm{font-size:20px;font-weight:500;color:#E6EDF3}
.srow .am{font-size:21px;font-weight:700;direction:ltr}
.pos{color:#22C55E}.neg{color:#F87171}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="wrap">
  <div class="phone">
    <div class="notch"></div>
    <div class="scard"><div class="lbl">מאזן החודש</div><div class="val">₪ 12,480</div></div>
    <div class="srow r1"><span class="nm">לקוחה</span><span class="am pos">+₪280</span></div>
    <div class="srow r2"><span class="nm">חומרים</span><span class="am neg">−₪140</span></div>
    <div class="srow r3"><span class="nm">לקוחה</span><span class="am pos">+₪180</span></div>
  </div>
  <div class="left">
    <div class="brand"><span class="shekel">₪</span><span class="bname">My Money</span></div>
    <div class="headline">הכספים של העסק<br><span class="hi">במקום אחד</span></div>
    <div class="sub">ניהול הכנסות, הוצאות ודוחות — לעצמאיות בתחום היופי. בעברית, פשוט.</div>
    <div class="tags"><span class="tag">דוחות מע״מ</span><span class="tag">SMS ללקוחות</span><span class="tag">יעדי חיסכון</span></div>
  </div>
</div>
</body></html>
