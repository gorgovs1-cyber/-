<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Rubik:wght@500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden;background:#0D1117}
body{font-family:'Heebo',sans-serif;
  background:radial-gradient(120% 90% at 80% 0%, #1C2128 0%, #0D1117 55%);color:#fff;position:relative}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.g1{width:520px;height:520px;background:#2DD4BF;top:-180px;left:-140px;opacity:.28}
.g2{width:420px;height:420px;background:#F59E0B;bottom:-160px;left:780px;opacity:.18}
.wrap{position:absolute;inset:0;padding:88px 80px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:16px}
.shekel{font-size:62px;color:#2DD4BF;line-height:1;text-shadow:0 0 26px rgba(45,212,191,.5)}
.bname{font-family:'Rubik';font-size:34px;font-style:italic;font-weight:700;color:#2DD4BF;letter-spacing:.5px}
.tagpill{margin-top:64px;align-self:flex-start;background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.35);
  color:#2DD4BF;font-weight:700;font-size:25px;padding:12px 28px;border-radius:40px}
.headline{margin-top:40px;font-size:96px;font-weight:900;line-height:1.08;letter-spacing:-1px}
.headline .hi{color:#2DD4BF}
.sub{margin-top:34px;font-size:36px;font-weight:500;color:#C9D1D9;line-height:1.5;max-width:880px}
.feats{margin-top:auto;display:flex;flex-direction:column;gap:22px}
.feat{display:flex;align-items:center;gap:20px;font-size:33px;font-weight:500;color:#E6EDF3}
.chk{width:50px;height:50px;border-radius:14px;background:rgba(34,197,94,.16);color:#22C55E;
  display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;flex-shrink:0}
.cta{margin-top:50px;background:#2DD4BF;color:#07242020;color:#06201D;font-family:'Rubik';font-weight:700;
  font-size:38px;text-align:center;padding:30px;border-radius:24px;box-shadow:0 20px 50px -16px rgba(45,212,191,.6)}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="wrap">
  <div class="brand"><span class="shekel">₪</span><span class="bname">My Money</span></div>
  <div class="tagpill">חדש · לעצמאיות בתחום היופי</div>
  <div class="headline">הכסף שלך<br><span class="hi">סוף סוף מסודר</span></div>
  <div class="sub">אפליקציה אחת לכל הכספים של העסק — בעברית, פשוטה, ובנויה בשבילך.</div>
  <div class="feats">
    <div class="feat"><span class="chk">✓</span>מעקב הוצאות והכנסות בלי אקסל</div>
    <div class="feat"><span class="chk">✓</span>דוחות מוכנים לרו״ח ולמע״מ</div>
    <div class="feat"><span class="chk">✓</span>תזכורות SMS אוטומטיות ללקוחות</div>
  </div>
  <div class="cta">התחילי חודש חינם 🎁</div>
</div>
</body></html>
