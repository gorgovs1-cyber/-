<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Rubik:wght@500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0D1117}
body{font-family:'Heebo',sans-serif;color:#fff;position:relative}
.glow{position:absolute;border-radius:50%;filter:blur:110px;filter:blur(110px)}
.g1{width:680px;height:680px;background:#2DD4BF;top:-220px;left:-180px;opacity:.30}
.g2{width:560px;height:560px;background:#F59E0B;top:1180px;left:740px;opacity:.16}
.wrap{position:absolute;inset:0;padding:130px 90px;display:flex;flex-direction:column;align-items:center;text-align:center}
.brand{display:flex;align-items:center;gap:18px;margin-bottom:20px}
.shekel{font-size:74px;color:#2DD4BF;text-shadow:0 0 30px rgba(45,212,191,.55)}
.bname{font-family:'Rubik';font-size:40px;font-style:italic;font-weight:700;color:#2DD4BF}
.kicker{font-size:30px;font-weight:700;color:#F59E0B;letter-spacing:1px;margin-top:60px}
.headline{font-size:118px;font-weight:900;line-height:1.05;margin-top:26px;letter-spacing:-2px}
.headline .hi{color:#2DD4BF}
.phone{margin-top:70px;width:430px;height:600px;border-radius:46px;border:9px solid #1C2128;
  background:linear-gradient(170deg,#161B22,#0D1117);position:relative;box-shadow:0 40px 90px -30px rgba(0,0,0,.8),0 0 0 2px rgba(45,212,191,.15)}
.notch{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#0D1117;border-radius:16px}
.scard{position:absolute;top:80px;left:34px;right:34px;background:linear-gradient(135deg,rgba(45,212,191,.14),rgba(45,212,191,.04));
  border:1px solid rgba(45,212,191,.25);border-radius:24px;padding:26px}
.scard .lbl{font-size:22px;color:#8B97A6;font-weight:500}
.scard .val{font-size:58px;font-weight:800;color:#2DD4BF;margin-top:8px;direction:ltr}
.srow{position:absolute;left:34px;right:34px;display:flex;justify-content:space-between;align-items:center;
  background:rgba(255,255,255,.04);border-radius:18px;padding:20px 22px}
.r1{top:280px}.r2{top:378px}.r3{top:476px}
.srow .nm{font-size:26px;font-weight:500;color:#E6EDF3}
.srow .am{font-size:28px;font-weight:700;direction:ltr}
.srow .pos{color:#22C55E}.srow .neg{color:#F87171}
.cta{margin-top:auto;background:#2DD4BF;color:#06201D;font-family:'Rubik';font-weight:700;font-size:46px;
  padding:38px 80px;border-radius:30px;box-shadow:0 26px 60px -18px rgba(45,212,191,.65)}
.swipe{margin-top:34px;font-size:30px;color:#C9D1D9;font-weight:500}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="wrap">
  <div class="brand"><span class="shekel">₪</span><span class="bname">My Money</span></div>
  <div class="kicker">לקוסמטיקאיות · מאפרות · בונות ציפורניים</div>
  <div class="headline">פחות בלגן<br><span class="hi">יותר רווח</span></div>
  <div class="phone">
    <div class="notch"></div>
    <div class="scard"><div class="lbl">מאזן החודש</div><div class="val">₪ 12,480</div></div>
    <div class="srow r1"><span class="nm">לקוחה — מני־פדי</span><span class="am pos">+₪280</span></div>
    <div class="srow r2"><span class="nm">חומרים</span><span class="am neg">−₪140</span></div>
    <div class="srow r3"><span class="nm">לקוחה — לק ג׳ל</span><span class="am pos">+₪180</span></div>
  </div>
  <div class="cta">נסי חודש חינם 🎁</div>
  <div class="swipe">החליקי למעלה ☝️</div>
</div>
</body></html>
